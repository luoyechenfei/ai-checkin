name: ai-checkin

services:
  ai-checkin:
    container_name: ai-checkin
    # 使用 GitHub Actions 构建并发布的镜像（多架构 amd64/arm64）
    # 可通过 IMAGE_TAG 固定版本，例如：IMAGE_TAG=v1.0.0 / sha-93607ea
    image: ghcr.io/luoyechenfei/ai-checkin:latest
    # 每次启动都拉取最新镜像，确保与仓库发布同步
    pull_policy: always
    restart: unless-stopped

    # 如需改为本地构建，注释掉上面的 image/pull_policy，改用下面这段：
    # build:
    #   context: .
    #   args:
    #     NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

    # 可选：如需从文件读取变量，取消下一行注释并创建 .env 文件
    # env_file:
    #   - .env

    environment:
      # 容器内监听端口（与下面的映射保持一致）
      INTERNAL_PORT: ${INTERNAL_PORT:-3000}
      # 容器系统时区
      TZ: ${TZ:-Asia/Shanghai}
      # SQLite 数据目录（需与 volumes 目标路径一致）
      DATA_DIR: /app/data
      NODE_ENV: production

    ports:
      # 外部端口:内部端口，两个端口均可自定义
      # 例：EXTERNAL_PORT=8080 INTERNAL_PORT=3000 docker compose up -d
      - "${EXTERNAL_PORT:-3000}:${INTERNAL_PORT:-3000}"

    volumes:
      # SQLite 数据库持久化到宿主机 ./data 目录，备份时直接复制该目录
      - ./data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.INTERNAL_PORT||3000)+'/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
